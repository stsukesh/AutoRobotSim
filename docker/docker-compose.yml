services:
  ros2-sim:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        USERNAME: robot
        USER_UID: 1000
        USER_GID: 1000
    image: auto_robot_sim:humble
    container_name: auto_robot_sim_container
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-$HOME/.Xauthority}:/home/robot/.Xauthority:rw
      - /dev/dri:/dev/dri:rw
      - ..:/workspace:rw
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: /bin/bash
